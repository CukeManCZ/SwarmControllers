# do not modify these
root: ./
name: simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
startup_window: status
pre_window: export UAV_TYPE=x500;
            export PLATFORM_CONFIG=`ros2 pkg prefix mrs_multirotor_simulator`/share/mrs_multirotor_simulator/config/mrs_uav_system/$UAV_TYPE.yaml;
            export USE_SIM_TIME="true";
            export RMW_IMPLEMENTATION=rmw_zenoh_cpp
windows:
  - router:
      layout: tiled
      panes:
        - ros2 run rmw_zenoh_cpp rmw_zenohd
  - simulator:
      layout: tiled
      panes:
        - ros2 launch mrs_multirotor_simulator multirotor_simulator.launch.py custom_config:=./config/simulator.yaml
  - hw_api:
      layout: tiled
      panes:
        - export UAV_NAME=uav1; ros2 launch mrs_multirotor_simulator hw_api.launch.py custom_config:=./config/hw_api.yaml
        - export UAV_NAME=uav2; ros2 launch mrs_multirotor_simulator hw_api.launch.py custom_config:=./config/hw_api.yaml
        - export UAV_NAME=uav3; ros2 launch mrs_multirotor_simulator hw_api.launch.py custom_config:=./config/hw_api.yaml
        #- export UAV_NAME=uav4; ros2 launch mrs_multirotor_simulator hw_api.launch.py custom_config:=./config/hw_api.yaml
        #- export UAV_NAME=uav5; ros2 launch mrs_multirotor_simulator hw_api.launch.py custom_config:=./config/hw_api.yaml
        #- export UAV_NAME=uav6; ros2 launch mrs_multirotor_simulator hw_api.launch.py custom_config:=./config/hw_api.yaml
        #- export UAV_NAME=uav7; ros2 launch mrs_multirotor_simulator hw_api.launch.py custom_config:=./config/hw_api.yaml
        #- export UAV_NAME=uav8; ros2 launch mrs_multirotor_simulator hw_api.launch.py custom_config:=./config/hw_api.yaml
        #- export UAV_NAME=uav9; ros2 launch mrs_multirotor_simulator hw_api.launch.py custom_config:=./config/hw_api.yaml
        #- export UAV_NAME=uav10; ros2 launch mrs_multirotor_simulator hw_api.launch.py custom_config:=./config/hw_api.yaml
  - core:
      layout: tiled
      panes:
        - export UAV_NAME=uav1; ros2 launch mrs_uav_core core.launch.py platform_config:=$PLATFORM_CONFIG world_config:=./config/world_config.yaml custom_config:=./config/custom_config.yaml network_config:=./config/network_config.yaml
        - export UAV_NAME=uav2; ros2 launch mrs_uav_core core.launch.py platform_config:=$PLATFORM_CONFIG world_config:=./config/world_config.yaml custom_config:=./config/custom_config.yaml network_config:=./config/network_config.yaml
        - export UAV_NAME=uav3; ros2 launch mrs_uav_core core.launch.py platform_config:=$PLATFORM_CONFIG world_config:=./config/world_config.yaml custom_config:=./config/custom_config.yaml network_config:=./config/network_config.yaml
        #- export UAV_NAME=uav4; ros2 launch mrs_uav_core core.launch.py platform_config:=$PLATFORM_CONFIG world_config:=./config/world_config.yaml custom_config:=./config/custom_config.yaml network_config:=./config/network_config.yaml
        #- export UAV_NAME=uav5; ros2 launch mrs_uav_core core.launch.py platform_config:=$PLATFORM_CONFIG world_config:=./config/world_config.yaml custom_config:=./config/custom_config.yaml network_config:=./config/network_config.yaml
        #- export UAV_NAME=uav6; ros2 launch mrs_uav_core core.launch.py platform_config:=$PLATFORM_CONFIG world_config:=./config/world_config.yaml custom_config:=./config/custom_config.yaml network_config:=./config/network_config.yaml
        #- export UAV_NAME=uav7; ros2 launch mrs_uav_core core.launch.py platform_config:=$PLATFORM_CONFIG world_config:=./config/world_config.yaml custom_config:=./config/custom_config.yaml network_config:=./config/network_config.yaml
        #- export UAV_NAME=uav8; ros2 launch mrs_uav_core core.launch.py platform_config:=$PLATFORM_CONFIG world_config:=./config/world_config.yaml custom_config:=./config/custom_config.yaml network_config:=./config/network_config.yaml
        #- export UAV_NAME=uav9; ros2 launch mrs_uav_core core.launch.py platform_config:=$PLATFORM_CONFIG world_config:=./config/world_config.yaml custom_config:=./config/custom_config.yaml network_config:=./config/network_config.yaml
        #- export UAV_NAME=uav10; ros2 launch mrs_uav_core core.launch.py platform_config:=$PLATFORM_CONFIG world_config:=./config/world_config.yaml custom_config:=./config/custom_config.yaml network_config:=./config/network_config.yaml
  - status:
      layout: tiled
      panes:
        - export UAV_NAME=uav1; ros2 run mrs_uav_status status.sh
        - export UAV_NAME=uav2; ros2 run mrs_uav_status status.sh
        - export UAV_NAME=uav3; ros2 run mrs_uav_status status.sh
        #- export UAV_NAME=uav4; ros2 run mrs_uav_status status.sh
        #- export UAV_NAME=uav5; ros2 run mrs_uav_status status.sh
        #- export UAV_NAME=uav6; ros2 run mrs_uav_status status.sh
        #- export UAV_NAME=uav7; ros2 run mrs_uav_status status.sh
        #- export UAV_NAME=uav8; ros2 run mrs_uav_status status.sh
        #- export UAV_NAME=uav9; ros2 run mrs_uav_status status.sh
        #- export UAV_NAME=uav10; ros2 run mrs_uav_status status.sh
  - midair_activation:
      layout: tiled
      panes:
        - export UAV_NAME=uav1; waitForCore; ./midair_activation.sh
        - export UAV_NAME=uav2; waitForCore; ./midair_activation.sh
        - export UAV_NAME=uav3; waitForCore; ./midair_activation.sh
        #- export UAV_NAME=uav4; waitForCore; ./midair_activation.sh
        #- export UAV_NAME=uav5; waitForCore; ./midair_activation.sh
        #- export UAV_NAME=uav6; waitForCore; ./midair_activation.sh
        #- export UAV_NAME=uav7; waitForCore; ./midair_activation.sh
        #- export UAV_NAME=uav8; waitForCore; ./midair_activation.sh
        #- export UAV_NAME=uav9; waitForCore; ./midair_activation.sh
        #- export UAV_NAME=uav10; waitForCore; ./midair_activation.sh
  - shape_controller:
      layout: tiled
      panes:
        - export UAV_NAME=uav1; waitForTakeoff; ros2 launch swarm_controllers shape_controller.launch.py 
        - export UAV_NAME=uav2; waitForTakeoff; ros2 launch swarm_controllers shape_controller.launch.py 
        - export UAV_NAME=uav3; waitForTakeoff; ros2 launch swarm_controllers shape_controller.launch.py
        #- export UAV_NAME=uav4; waitForTakeoff; ros2 launch swarm_controllers shape_controller.launch.py
        #- export UAV_NAME=uav5; waitForTakeoff; ros2 launch swarm_controllers shape_controller.launch.py
        #- export UAV_NAME=uav6; waitForTakeoff; ros2 launch swarm_controllers shape_controller.launch.py
        #- export UAV_NAME=uav7; waitForTakeoff; ros2 launch swarm_controllers shape_controller.launch.py
        #- export UAV_NAME=uav8; waitForTakeoff; ros2 launch swarm_controllers shape_controller.launch.py
        #- export UAV_NAME=uav9; waitForTakeoff; ros2 launch swarm_controllers shape_controller.launch.py
        #- export UAV_NAME=uav10; waitForTakeoff; ros2 launch swarm_controllers shape_controller.launch.py
  - activation:
      layout: tiled
      synchronize: after
      panes:
        - export UAV_NAME=uav1; waitForControl; history -s ros2 service call /$UAV_NAME/activation std_srvs/srv/Trigger
        - export UAV_NAME=uav2; waitForControl; history -s ros2 service call /$UAV_NAME/activation std_srvs/srv/Trigger
        - export UAV_NAME=uav3; waitForControl; history -s ros2 service call /$UAV_NAME/activation std_srvs/srv/Trigger
        #- export UAV_NAME=uav4; waitForControl; history -s ros2 service call /$UAV_NAME/activation std_srvs/srv/Trigger
        #- export UAV_NAME=uav5; waitForControl; history -s ros2 service call /$UAV_NAME/activation std_srvs/srv/Trigger
        #- export UAV_NAME=uav6; waitForControl; history -s ros2 service call /$UAV_NAME/activation std_srvs/srv/Trigger
        #- export UAV_NAME=uav7; waitForControl; history -s ros2 service call /$UAV_NAME/activation std_srvs/srv/Trigger
        #- export UAV_NAME=uav8; waitForControl; history -s ros2 service call /$UAV_NAME/activation std_srvs/srv/Trigger
        #- export UAV_NAME=uav9; waitForControl; history -s ros2 service call /$UAV_NAME/activation std_srvs/srv/Trigger
        #- export UAV_NAME=uav10; waitForControl; history -s ros2 service call /$UAV_NAME/activation std_srvs/srv/Trigger
  - data_gatherer:
      layout: tiled
      panes:
        - waitForControl; ros2 launch swarm_controllers data_gatherer.launch.py
  - waypoint:
      layout: tiled
      panes:
        - ./custom_sh/send_waypoint.sh
  - constants:
      layout: tiled
      panes:
        - ./custom_sh/send_boid_constants.sh
  - tcp:
      layout: tiled
      panes:
        - tcp
  - rviz:
      layout: tiled
      panes:
        - ros2 run rviz2 rviz2 -d ./CustomRviz.rviz
  - layout:
      layout: tiled
      panes:
        - sleep 2.0; ~/.i3/layout_manager.sh ./layout.json
